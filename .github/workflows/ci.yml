name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ['v*']

# Cancel in-progress runs for the same branch when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Frontend CI: lint, build, e2e
  # ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit

      - name: Lint
        # STRICT since 2026-08-19: eslint 9 + angular-eslint flat config are
        # wired; any error or warning fails the job (mirrors pre-commit [12/12]).
        # Bare `npm run lint`: defaults.run.working-directory is already
        # `frontend` — `npm --prefix frontend` doubled the path to
        # frontend/frontend/package.json, breaking CI on this branch's first
        # ever push (2026-08-20, run 32338301784) and every run since.
        run: npm run lint

      - name: Build
        run: npx ng build --configuration production

      - name: Audit (production deps only)
        run: npm audit --omit=dev

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # Detect whether backend/ exists. Outputs a boolean that downstream
  # jobs use to decide whether to run. hashFiles() is not allowed in
  # job-level `if:` (see
  # https://github.com/orgs/community/discussions/25790), so we capture
  # the file existence in a step's GITHUB_OUTPUT and consume the
  # output from `needs`.
  # ─────────────────────────────────────────────────────────────────
  detect:
    name: Detect repo layout
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.detect.outputs.has_backend }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f backend/go.mod ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────
  # Backend CI: vet, test, build (deferred until backend/ exists)
  # ─────────────────────────────────────────────────────────────────
  backend:
    name: Backend (vet + test + build)
    runs-on: ubuntu-latest
    needs: [detect]
    # Skip the entire backend job when backend/ doesn't exist yet.
    if: needs.detect.outputs.has_backend == 'true'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -o meridian-backend ./cmd/server
        # Path may need to change once the binary entrypoint is locked.

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: meridian-backend-${{ github.sha }}
          path: backend/meridian-backend
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────
  # Docs / skills / workflows drift check
  # ─────────────────────────────────────────────────────────────────
  docs:
    name: Docs + skills lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow yaml
        run: |
          python3 -c "
          import yaml, sys, glob
          ok = True
          for path in glob.glob('.github/workflows/*.yml') + glob.glob('.agents/workflows/*.yaml'):
              try:
                  with open(path) as f:
                      yaml.safe_load(f)
                  print(f'OK  {path}')
              except Exception as e:
                  print(f'FAIL {path}: {e}', file=sys.stderr)
                  ok = False
          sys.exit(0 if ok else 1)
          "

      - name: Skill frontmatter check
        run: |
          # Every SKILL.md must have YAML frontmatter with name + description.
          python3 -c "
          import re, sys, glob
          ok = True
          for path in glob.glob('.agents/skills/*/SKILL.md'):
              with open(path) as f:
                  content = f.read()
              m = re.match(r'^---\n(.*?)\n---\n', content, re.DOTALL)
              if not m:
                  print(f'FAIL {path}: no frontmatter', file=sys.stderr); ok = False; continue
              fm = m.group(1)
              if 'name:' not in fm or 'description:' not in fm:
                  print(f'FAIL {path}: frontmatter missing name/description', file=sys.stderr); ok = False
              else:
                  print(f'OK  {path}')
          sys.exit(0 if ok else 1)
          "

      - name: PR template present
        run: test -f .github/pull_request_template.md

      - name: AGENTS.md present
        run: test -f AGENTS.md

  # ─────────────────────────────────────────────────────────────────
  # Aggregate gate — all jobs must succeed
  # ─────────────────────────────────────────────────────────────────
  aggregate:
    name: All gates green
    runs-on: ubuntu-latest
    needs: [detect, frontend, backend, docs]
    if: always()
    steps:
      - name: Check job results
        run: |
          # detect is a pure sensor; treat it as success regardless of result.
          # backend is conditional on backend/go.mod existing; treat
          # 'skipped' as success so this gate passes for frontend-only repos.
          DETECT="${{ needs.detect.result }}"
          FRONTEND="${{ needs.frontend.result }}"
          BACKEND="${{ needs.backend.result }}"
          DOCS="${{ needs.docs.result }}"
          [ "$DETECT" = "success" ] || [ "$DETECT" = "skipped" ] || { echo "detect failed"; exit 1; }
          [ "$BACKEND" = "success" ] || [ "$BACKEND" = "skipped" ] || { echo "backend failed"; exit 1; }
          [ "$FRONTEND" = "success" ] || { echo "frontend failed"; exit 1; }
          [ "$DOCS" = "success" ] || { echo "docs failed"; exit 1; }
          echo "All CI gates green"