name: build

# Renamed from "deploy" to "build" — the workflow no longer deploys.
# It runs on master push after CI passes, builds the production
# artifacts, and uploads them so the developer can pull and deploy
# from their local machine (frontend via vercel CLI, backend via scp
# or `gh run download`).
#
# Why no auto-deploy: avoids paying for cloud tiers while the project
# is pre-production. The developer retains full control over when
# staging/production gets new code. See
# .agents/skills/git-conventions/SKILL.md ("Repo specifics") for the
# long-term migration plan.

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build production artifacts
    runs-on: ubuntu-latest
    # Only run after CI passed on the same commit. workflow_run
    # reports the CI conclusion; skip when CI failed.
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────
      # Frontend build → production bundle as artifact
      # ─────────────────────────────────────────────────────────────
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm install --legacy-peer-deps --no-audit
        working-directory: frontend

      - name: Build production
        run: npx ng build --configuration production
        working-directory: frontend

      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: meridian-frontend-${{ github.sha }}
          path: frontend/dist/meridian/browser/
          retention-days: 30

      # ─────────────────────────────────────────────────────────────
      # Backend build → binary as artifact (only when backend exists)
      # ─────────────────────────────────────────────────────────────
      - name: Setup Go
        if: hashFiles('backend/go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Build backend
        if: hashFiles('backend/go.mod') != ''
        working-directory: backend
        run: |
          mkdir -p dist
          go build -o dist/meridian-backend ./cmd/server

      - name: Upload backend binary
        if: hashFiles('backend/go.mod') != ''
        uses: actions/upload-artifact@v4
        with:
          name: meridian-backend-${{ github.sha }}
          path: backend/dist/meridian-backend
          retention-days: 30